<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08bfc9"><title>Number Rush</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08c7d2;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #006b7b;font-weight:900}#top{position:absolute;top:18px;width:100%;text-align:center;font-size:clamp(20px,5vw,30px)}#score{position:absolute;top:58px;width:100%;text-align:center;font-size:18px}#hint{position:absolute;bottom:22%;width:100%;text-align:center;font-size:14px;opacity:.85}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#003d5266;pointer-events:auto}#panel{width:min(86%,360px);padding:28px 24px;border-radius:26px;background:linear-gradient(160deg,#ffffff,#e3fbff);text-align:center;color:#123b63;box-shadow:0 14px 35px #004f5c66}h1{margin:0 0 8px;font-size:32px}p{line-height:1.45}button{border:0;border-radius:999px;background:linear-gradient(90deg,#ffb22d,#ff6b45);color:white;font-size:20px;font-weight:900;padding:15px 28px;width:100%;box-shadow:0 5px 0 #d94d2b}button:active{transform:translateY(3px);box-shadow:0 2px 0 #d94d2b}.small{font-size:12px;color:#55738a}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="top">NUMBER RUSH</div><div id="score">NUMBER: 1　 •　 LEVEL 1</div><div id="hint">SWIPE LEFT & RIGHT TO DODGE</div></div><div id="overlay"><div id="panel"><h1>🔢 Number Rush</h1><p>Grow your number! Collect blue <b>+</b> gates, dodge red <b>−</b> gates, and reach the finish with the biggest number.</p><button id="play">PLAY NOW</button><p class="small">Offline • No ads • Made for touch screens</p></div></div><script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay'),play=document.getElementById('play'),hint=document.getElementById('hint');let W,H,dpr,player,items,dist,level,running,won,last,spawned;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function reset(){player={x:0,n:1};items=[];dist=0;level=1;spawned=0;running=true;won=false;last=performance.now();overlay.style.display='none';hint.textContent='SWIPE LEFT & RIGHT TO DODGE';for(let i=0;i<15;i++)spawn(i*100+260);requestAnimationFrame(loop)}function spawn(z){let lane=Math.floor(Math.random()*3)-1;let type=Math.random()<.58?'plus':Math.random()<.5?'minus':'block';items.push({x:lane,z,type,val:type==='plus'?Math.floor(Math.random()*5)+2:Math.floor(Math.random()*3)+1,done:false})}let down=false,startX=0;function pointerDown(e){down=true;startX=e.clientX}function pointerMove(e){if(!down||!running)return;player.x=Math.max(-1,Math.min(1,player.x+(e.clientX-startX)/Math.max(100,W*.22)));startX=e.clientX}function pointerUp(){down=false}c.addEventListener('pointerdown',pointerDown);c.addEventListener('pointermove',pointerMove);c.addEventListener('pointerup',pointerUp);c.addEventListener('pointercancel',pointerUp);play.onclick=reset;function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67,2);last=t;dist+=dt*2.5;ctx.clearRect(0,0,W,H);let horizon=H*.19,base=H*1.03,cx=W/2;let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#00a9d0');grad.addColorStop(1,'#20e0cb');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H); // distant icy scenery
for(let i=0;i<10;i++){let x=(i*W/8+Math.sin(i*12)*20)%W;ctx.fillStyle='#b7f7ff33';ctx.beginPath();ctx.moveTo(x-45,horizon+40);ctx.lineTo(x,horizon-55-(i%3)*25);ctx.lineTo(x+65,horizon+60);ctx.fill()}
ctx.beginPath();ctx.moveTo(cx-W*.09,horizon);ctx.lineTo(cx+W*.09,horizon);ctx.lineTo(W*.98,base);ctx.lineTo(W*.02,base);ctx.closePath();ctx.fillStyle='#e9fdff';ctx.fill();ctx.strokeStyle='#c2f3fa';ctx.lineWidth=2;ctx.stroke();for(let i=0;i<6;i++){let yy=horizon+((dist*13+i*95)%(H-horizon));let f=(yy-horizon)/(base-horizon);ctx.strokeStyle='#c7f5fa';ctx.beginPath();ctx.moveTo(cx-W*.09*f,yy);ctx.lineTo(cx+W*.09*f,yy);ctx.stroke()}
// gates and obstacles in perspective
for(const it of items){it.z-=dt*2.5;let f=1-it.z/1500;if(f<0||f>1.2)continue;let y=horizon+f*(H*.76),spread=W*.09+f*W*.41,x=cx+it.x*spread;let size=16+f*22;if(it.type==='block'){roundRect(x-size,y-size*.5,size*1.6,size*1.8,5,'#6c7b88')}else{roundRect(x-size*1.2,y-size*.75,size*2.4,size*1.5,9,it.type==='plus'?'#32cf86':'#ff5b67');ctx.fillStyle='white';ctx.textAlign='center';ctx.font=`900 ${Math.max(12,size*.9)}px system-ui`;ctx.fillText((it.type==='plus'?'+':'−')+it.val,x,y+size*.3)}if(f>.86&&!it.done){it.done=true;if(Math.abs(player.x-it.x)<.47){if(it.type==='plus')player.n+=it.val;else if(it.type==='minus')player.n=Math.max(1,player.n-it.val);else player.n=Math.max(1,player.n-2);if(it.type==='block'&&player.n===1){end(false)} }} }
items=items.filter(i=>i.z>-100);if(items.length<13){spawned+=1;spawn(1400+Math.random()*180)}
// runner number
let px=cx+player.x*W*.34,py=H*.78;ctx.save();ctx.shadowColor='#4834b8';ctx.shadowBlur=12;ctx.fillStyle='#5748e8';ctx.strokeStyle='#3426b1';ctx.lineWidth=3;ctx.font=`1000 ${Math.min(64,34+Math.log10(player.n+1)*10)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(player.n,px,py);ctx.fillText(player.n,px,py);ctx.restore();scoreEl.textContent=`NUMBER: ${player.n}　 •　 LEVEL ${level}`;
// finish line
if(dist>1800){end(true);return}requestAnimationFrame(loop)}function end(win){if(!running)return;running=false;overlay.style.display='flex';document.querySelector('#panel h1').textContent=win?'🏆 LEVEL COMPLETE!':'💥 TRY AGAIN!';document.querySelector('#panel p').innerHTML=win?`You finished with <b>${player.n}</b>! Ready for the next run?`:`Your final number was <b>${player.n}</b>. Dodge obstacles and collect + gates to grow!`;play.textContent=win?'NEXT LEVEL':'RETRY';dist=0} // end trigger and progress
const oldLoop=loop;loop=function(t){if(running&&dist>1800){end(true);return}oldLoop(t)};
})();</script></body></html>
